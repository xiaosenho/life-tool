name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test backend
        run: |
          if [ -f "pom.xml" ]; then
            mvn test
          else
            echo "backend/pom.xml not found, skip backend tests."
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Check frontend
        run: |
          if [ -f "package.json" ]; then
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm build
          else
            echo "frontend/package.json not found, skip frontend checks."
          fi
